[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "brain-local-memory"
version = "0.1.0"
description = "Local-first project memory for AI tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
brain = "brain.__main__:main"

[dependency-groups]
dev = ["ruff", "mypy", "bandit"]

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/brain"]
