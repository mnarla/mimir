[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mimir-local-memory"
version = "0.1.0"
description = "Local-first project memory for AI tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio==4.16.0",
    "fastapi==0.165.0",
    "httpx==0.29.0",
    "jsonschema==4.26.0",
    "mcp==1.30.0",
    "pathspec==1.1.1",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[project.scripts]
mimir = "mimir.__main__:main"

[project.optional-dependencies]
semantic = [
    "fastembed==0.9.1",
    "sqlite-vec==0.1.9",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "bandit",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mimir"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/mimir"]
